[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "message-evidence-workstation"
version = "0.1.0"
description = "Desktop workstation for reviewing donor message datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["message_evidence_workstation*"]

[tool.setuptools.package-data]
message_evidence_workstation = ["native/*.dll", "native/*.so", "native/*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not scale'"
markers = [
    "scale: performance or large-fixture tests (run with -m scale)",
]
